<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body><h1>
        <table border="1" style="text-align: left;"><form action="(0)mekan.html">
            <tr>
            <th>AD</th>
            <th><input type="text" required="required" placeholder="Adınızı giriniz..."></th>
            </tr>
            <tr>
                <th>Soyad</th>
                <th><input type="text" required="required" placeholder="Soyadınızı giriniz..."></th>
            </tr>
            <tr>
                <th>Yaş</th>
                <th><input style="width: 200px;" type="number" min="7" max="20" required="required"  placeholder="Yaşınızı giriniz (7-20)"></th>
            </tr>
            <tr>
                <th>Resim Ekle </th>
                <th><input type="file"  value="Gözat..." name="dosya"></th>
            </tr>
            <tr>
                <th>TC No</th>
                <th><input type="text"></th>
            </tr>
            <tr>
                <th>Cinsiyet</th>
                <th><input type="radio" name="cinsiyet">K <input type="radio" name="cinsiyet">E</th>
            </tr>
            <tr>
                <th>Yabancı Diller</th>
                <th><input type="checkbox" name="ingilizce">İngilizce <input type="checkbox" name="almanca">Almanca <input type="checkbox" name="fransızca">Fransızca</th>
            </tr>
            <tr>
                <th>Görüş</th>
                <th><textarea name="yorum" tabindex="2" placeholder="Yorumunuzu giriniz..." required="required" rows="3" cols="20"></textarea></th>
            </tr>
            <tr>
                <th colspan="2"><input type="submit" value="Gönder"><input type="reset" value="Temizle"></th>
            </tr>
        </form></table>
</h1></body>
</html>
