<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
  <label>Adınız</label>
  <input type="text" name="ad"><br><br>

  <label>Şifreniz</label>
  <input type="password" name="sifre"><br><br>

  <label>Cinsiyetiniz</label>
  <input type="radio" name="cinsiyet" value="erkek" checked> Erkek
  <input type="radio" name="cinsiyet" value="kiz"> Kiz
  <br><br>

  <label>Bildiğiniz Diller:</label>
  <input type="checkbox" name="dil" value="ingilizce"> İngilizce
  <input type="checkbox" name="dil" value="almanca"> Almanca
  <input type="checkbox" name="dil" value="japonca"> Japonca
  <br><br>

  <label>İl</label>
  <select name="iller">
    <option>İstanbul</option>
    <option>Ankara</option>
    <option>İzmir</option>
    <option>Trabzon</option>
    <option>Düzce</option>
  </select>
  <br><br>

  <label>Adres</label><br>
  <textarea rows="4" cols="40">Görüşünüz bizim için önemli.</textarea>
  <br><br>

  <input type="submit" value="Formu Kaydet">
  <input type="reset" value="Formu Temizle">
</form>
</body>
</html>
